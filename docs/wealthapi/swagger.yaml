        required: false
        description: Comma separated values of isins to be found
        schema:
          type: string
      - name: filter[bank_slug]
        in: query
        required: false
        schema:
          type: string
          enum:
          - binance
          - bison_app
          - Bitpanda
          - bitvavo
          - coinbase
          - comdirect_user_api
          - commerzbank
          - Degiro
          - deutsche_bank
          - finanzen_net_zero
