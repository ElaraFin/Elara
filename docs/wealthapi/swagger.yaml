                    is_etc: false
                    is_etf: true
                    is_curated: false
                    short_name: iShares Core S&P 500 UCITS ETF
                  meta:
                    created_at: '2026-08-25T09:08:56Z'
                    updated_at: '2026-08-25T09:08:56Z'
