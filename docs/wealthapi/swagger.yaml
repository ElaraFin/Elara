          - FAILED_WITH_ERROR
          description: Progress of the current import or update run; useful to display
            the progress to end users
        last_connection_attempt:
          type: string
          description: DateTime of the last connection attempt
        last_successful_connection_attempt:
          type: string
          nullable: true
          description: DateTime of the last SUCCESSFUL connection attempt
        connection_error:
          type: string
          nullable: true
          description: Any error message that we received from the bank
