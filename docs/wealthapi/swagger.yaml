---
openapi: 3.0.1
info:
  title: API V3
  version: v3
paths:
  "/api/v3/admin_manager/etf_type_classifications":
    get:
      summary: list classifications
      tags:
      - 'Admin Manager: ETF type classification'
      operationId: adminManagerListEtfTypeClassifications
      security:
      - Bearer: []
      parameters:
      - name: filter[isins]
        in: query
        required: false
        description: Comma separated values of isins to be found
        schema:
          type: string
      responses:
        '200':
          description: Classification lists is returned
          content:
            application/vnd.api+json:
              example:
                data:
                - id: '22'
                  type: etf_type_classifications
                  attributes:
                    isin: IE00BKWQ0P020
                    is_etc: false
                    is_etf: true
                    is_curated: false
                    short_name: iShares Core S&P 500 UCITS ETF
                  meta:
                    created_at: '2026-08-25T09:08:56Z'
