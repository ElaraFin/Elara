              - bank_connection_id
              - depot_ids
              properties:
                bank_slug:
                  type: string
                  nullable: false
                  description: A unique identifier representing the bank associated
                    with this tax allowance.
                  enum:
                  - binance
                  - bison_app
                  - Bitpanda
                  - bitvavo
                  - coinbase
                  - comdirect_user_api
                  - commerzbank
                  - Degiro
                  - deutsche_bank
                  - finanzen_net_zero
