          - onvista
          - Parqet
          - Quirion
          - ScalableCapital
          - SmartbrokerPlus
          - TradeRepublic
          - Trading212
          - wealthapi_mock_bank
          - Whitebox
        description: Bank slug
      - name: filter[transaction_id]
        in: query
        required: false
        schema:
          type: string
        description: Unique ID provided by the bank
      - name: filter[user_id]
        in: query
        required: false
        schema:
          type: integer
        description: User ID
      - name: filter[bank_connection_id]
        in: query
        required: false
        schema:
          type: integer
        description: Bank connection ID
      - name: filter[bank_sync_log_id]
        in: query
        required: false
        schema:
          type: integer
        description: Bank sync ID
