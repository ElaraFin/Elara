      type: object
      required:
      - data
      description: Represents a tax allowance resource associated with the bank connection.
      properties:
        data:
          type: object
          required:
          - id
          - type
          - attributes
          - meta
          properties:
            id:
              type: string
              description: A unique identifier for this tax allowance
            type:
              type: string
              description: The resource type; always "tax_allowance" for this endpoint.
            attributes:
              type: object
              required:
