            id:
              type: string
              description: A technical identifier
            type:
              type: string
            attributes:
              "$ref": "#/components/schemas/bank_rate_limit_attributes"
    bank_rate_limit_attributes:
      type: object
      required:
      - connections_performed
      - mandator_rate_limit_status
      - mandator_slug
      - max_rate_limit_per_mandator
      properties:
        connections_performed:
          type: integer
          description: Total number of connections performed within the time period
        mandator_rate_limit_status:
          type: string
          enum:
          - BLOCKED
          - BUSY
          - MODERATE
          - RELAXED
          description: The overall status of the bank rate limit. BLOCKED (new connections
            are not allowed), BUSY (connections are over 66%), MODERATE (connections
            are between 33% and 66%) and RELAXED (connections are under 33%)
        mandator_slug:
          type: string
          description: Mandator of the user
        max_rate_limit_per_mandator:
          type: integer
          description: Maximum number of connections allowed per time period
    bank_connection:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - id
          - type
          - attributes
          - meta
          properties:
            id:
              type: string
              description: A unique identifier for this bank connection based on banking
                data
            type:
              type: string
            attributes:
              "$ref": "#/components/schemas/bank_connection_attributes"
            meta:
              "$ref": "#/components/schemas/bank_connection_meta"
    bank_connection_attributes:
      type: object
      required:
      - user_id
      - bank_name
      - has_stored_password
      properties:
        user_id:
          type: integer
          description: ID of the user holding the bank connection
        bic:
          type: string
          description: BIC (if any)
        is_2fa_required:
          type: boolean
          description: Is 2FA required for this bank connection?
        force_full_import:
          type: boolean
          description: 'Indicates if a forced full import will be enforced. Default:
            FALSE'
        bank_name:
          type: string
          description: 'The name (also: slug) fo the bank'
        login:
          type: string
          description: The stored banking login
        area_code:
          type: string
          nullable: true
          description: 'The (phone number) area code if any; example: +49'
        has_stored_password:
          type: boolean
          description: Did the user opt to store the banking password?
        enforce_tpp_web_form:
          type: boolean
          description: Indicates if the TPP web form should be enforced
    bank_connection_meta:
      type: object
      required:
      - connection_status
      - last_connection_attempt
      properties:
        connection_status:
          type: string
          enum:
          - SUCCESS
          - FAILED
          - IN_PROGRESS
          - PROCESSING_IN_BACKGROUND
          description: The overall status of the bank connection
        import_progress:
          type: string
          nullable: true
          enum:
          - CONNECTING
          - ACCOUNTS
          - TRANSACTIONS
          - SECURITIES
          - PERSISTING_TRANSACTIONS
          - PERSISTING_BOOKINGS
