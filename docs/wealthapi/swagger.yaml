  "/api/v3/plug_and_play/products/":
    get:
      summary: Returns a list of products. The list can be filtered by using the request
        parameters described below.
      tags:
      - Plug and Play
      operationId: listProducts
      security:
      - Bearer: []
      parameters:
      - name: include
        in: query
        required: false
        description: |-
          Option to include the full entity of a relationship.
                                       <br> Supported: `risk_yield`, `pricing`,`pricing.bank_fee`, `quote`
                                       <br><br> Example: `include=pricing`
        schema:
          type: string
      - name: filter[risk_class_complex]
        in: query
        required: false
        description: Filter the list by product risk *complex* class
        schema:
          type: string
      - name: filter[risk_class.lte]
        in: query
        required: false
        description: Filter the list by products with risk class *less than or equal*
          to the value
        schema:
          type: string
      - name: filter[performance_class_complex]
        in: query
        required: false
        description: Filter the list by the product performance *complex* class
        schema:
          type: string
      - name: filter[performance.gte]
        in: query
        required: false
        description: |-
          Filter the list with products with a performance *greater than or equal* to the value
                                        over the given years in `filter[performance.years]`. This value should be given
                                        as a decimal number, not as a percentage [0.1 = 10%] and should be annualized.
        schema:
          type: string
      - name: filter[risk.lte]
        in: query
        required: false
        description: |-
          Filter the list with products with a risk *less than or equal* to the value
                                          over the given years in `filter[risk_years]`. This value should be given
                                          as a decimal number, not as a percentage [0.1 = 10%] and should be annualized.
        schema:
          type: string
      - name: filter[risk.years]
        in: query
        required: false
        description: |-
          Number of years over which the risk is calculated. Default is 3 years.
                                        Supported values: 1, 2, 3, 5, 10 years.
                                        <br> For example: If you want to filter products with a risk of 5% or less over 5 years,
                                        you would use: *filter[risk.years]=5&filter[risk.lte]=0.05*
        schema:
          type: string
      - name: filter[performance.years]
        in: query
        required: false
        description: |-
          Number of years over which the performance is calculated. Default is 3 years.
                                        Supported values: 1, 2, 3, 5, 10 years.
                                        <br> For example: If you want to filter products with a performance of 5%
                                        or less over 5 years, you would use: *filter[performance.years]=5
                                        &filter[performance.lte]=0.05*
        schema:
          type: string
      - name: filter[category.product_class]
        in: query
        required: false
        description: Filter the list by the product class category
        schema:
          type: string
      - name: sort
        in: query
        required: false
        description: |-
          Sort by a specific field. The field should be prefixed with a `-`
                                        to sort in descending order. <br> Supported: `risk`, `performance`
        schema:
          type: string
      responses:
        '200':
          description: products
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/list_products_response"
