        schema:
          type: string
      - name: filter[product.risk_class.lte]
        in: query
        required: false
        description: Filter recommendations by products with risk class *less than
          or equal* to the value
        schema:
          type: string
      - name: session_id
        in: query
        required: false
        description: Session ID representing an anonymous user. Required when user
