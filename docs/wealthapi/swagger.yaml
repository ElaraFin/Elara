    data_reconciliation_create_or_update_booking_params:
      type: object
      properties:
        numberOfLots:
          type: string
          format: decimal
          description: The number of lots; may be floating point and must be greater
            than zero; required for creation
          example: '100.0'
        securityPrice:
          type: string
          format: decimal
          description: |-
            The UNSIGNED price per lot; \
                                    For dividends and kupons this should be the total amount (numberOfLots x dividend per lot). \
                                    For retained dividends this field is ignored, as the security price is always zero. \
                                    For book_out this field is used if given; or otherwise derived from the existing booking history if null. \
                                    In both cases (retained_dividend and book_out), the entryQuote is used for performance calculations instead of the security price.
          example: '100.0'
        entryQuote:
          type: string
          format: decimal
          description: |-
            For Book-Ins and retained Dividends: An UNSIGNED entry quote per lot. \
                                    For other booking types this value is ignored and the security price equals the entry quote. \
                                    As book-ins and retained dividends use the entry quote for performance calculation,\
                                    the entry quote should match the quote at the date of book-in. \
                                    In addition, the security price for book-ins should equal to the price that was originally paid for the booked-in security. \
                                    For retained dividends, the security price is always zero, as these shares were for free.
          example: '100.0'
        priceCheckRequired:
          type: boolean
          description: Indicates that prices were estimated and that a price check
            should be performed by the user.
        date:
          type: string
          format: date
          description: The booking's booking date (Buchungsdatum); required for creation
          example: Fri, 23 Feb 2024
        valueDate:
          type: string
          format: date
          description: The booking's value date (Wertstellungsdatum); optional. Will
            default to date if not given
          example: Fri, 23 Feb 2024
        dateIsEstimate:
          type: boolean
          description: Indicates that the date is an estimate and that a check should
            be performed by the user
        exchangeRate:
          type: string
          format: decimal
          description: The exchange rate; will be set to 1 if currency is EUR; required
            for creation
          example: '1.0'
        type:
          type: string
          description: The booking type; required for creation
          enum:
          - buy
          - sell
          - book_in
          - book_out
          - dividend
          - pre_tax_allowance
          - retained_dividend
          - purchase_right
          - switch
          - carve_out
        isCancellation:
          type: boolean
          description: This is a cancellation. If the cancelled transaction can be
            located, it will be cancelled.                         Otherwise the transaction
            will be booked as its 'inverted' value. E.g. a buy would become a sell
            and vice versa.
        commission:
          type: string
          format: decimal
          description: The paid commission; defaults to zero
          example: '10.0'
        taxAmount:
          type: string
          format: decimal
          description: The paid tax; defaults to zero
          example: '10.0'
        expensesInEur:
          type: boolean
          description: |-
            For foreign currency investments. \
                                    Allows denoting expenses in EUR; even if the investment denotes in another currency. \
                                    Expenses will be automatically converted to the investment currency if this flag is true. \
                                    Otherwise the endpoint assumes that expenses denote in investment currency. \
                                    Defaults to false.
        finApiId:
          type: string
          description: The finAPI ID (if present)
        reference:
          type: string
          description: |-
            A reference ID, typically provided by the bank. \
                                    The reference may be used to reference corresponding cash transactions, or other things as defined by the bank
        dataSource:
          type: string
          description: |-
            The data source that created this booking. \
                                    This value will be auto-assigned by automated import routines. Default is not to assign a value.
          enum:
          - BANKING_API
          - PDF
          - CSV
          - USER_INPUT
        comment:
          type: string
          description: A user comment. This is NOT the transaction purpose.
        commentVisibility:
          type: string
          description: Visibility of the user comment; required for creation
          enum:
          - anybody
          - friends
          - nobody
          deprecated: true
        notifyFriends:
          type: boolean
          description: Should we notify friends via email? Default is false
          deprecated: true
    active_users_by_bank:
      type: object
      properties:
