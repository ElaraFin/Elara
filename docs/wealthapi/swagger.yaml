  "/api/v3/csv/parse":
    post:
      summary: parse a CSV
      tags:
      - CSV
      operationId: parseCsv
      security:
      - Bearer: []
      parameters: []
      responses:
        '200':
          description: CSV parsed
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/csv_parse_result"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: file
                  description: CSV file to be parsed
                bank_slug:
                  type: string
                  description: 'The unique identifier for the bank.             Supported
                    values: `Parqet`, `ScalableCapital`, `extra_etf`, `portfolio_performance_securities`,
                    `portfolio_performance_cash`, `generic`, `n26`, `outbank`, `finanzguru`,
                    `copilot`, `trade_republic_csv`'
                  enum:
                  - Parqet
                  - ScalableCapital
                  - extra_etf
                  - portfolio_performance_securities
                  - portfolio_performance_cash
                  - generic
                  - n26
                  - outbank
                  - finanzguru
                  - copilot
                  - trade_republic_csv
                  default: Parqet
                type:
                  type: string
                  description: type of import, can be booking or cash transaction
                  enum:
                  - booking
                  - cash_transaction
                use_ai_fallback:
                  type: boolean
                  description: Opt in to agentic (LLM-based) inference when no known
                    provider matches. <br>When `true`, and the CSV does not match
                    any known provider, an LLM is used to infer the column mappings
                    so the file can still be parsed. The inference is best-effort,  100%
                    accuracy is not guaranteed.<br>When `false` (the default), unrecognized
                    CSV formats raise a classification error and no LLM call is made.
                  default: false
