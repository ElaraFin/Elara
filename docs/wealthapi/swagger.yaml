  "/api/v3/mandators/{mandator_public_id}/users/{user_id}/import_or_update":
    post:
      summary: import or update portfolio for a mandator user
      description: Triggers the portfolio import or update process for the specified
        user. This operation is asynchronous, a successful response indicates that
        the process has been initiated. To check the status of the import, API consumers
        should poll the returned Bank Connection resource.
      tags:
      - Mandator Portfolio Management
      operationId: importOrUpdatePortfolio
      security:
      - Bearer: []
      parameters:
      - name: mandator_public_id
        in: path
        required: true
        description: Public ID of the mandator
        schema:
          type: string
      - name: user_id
        in: path
        required: true
        description: ID of the user (wealthAPI internal user ID) whose portfolio is
          to be imported or updated
        schema:
          type: integer
      responses:
        '200':
          description: portfolio import or update triggered successfully.
          content:
            application/json:
              example:
                data:
                  id: '35'
                  type: bank_connections
                  attributes:
                    user_id: 152
                    bank_name: finanzen_net_zero
                    is_2fa_required: false
                    bic: BDWBDEMM002
                    login: XXXXX
                    area_code:
                    enforce_tpp_web_form: false
                    mandator_provisioned: true
                    has_stored_password: false
                  meta:
                    connection_status: IN_PROGRESS
                    is_2fa_required: false
                    import_progress: CONNECTING
                    last_connection_attempt: '2026-08-25T09:09:03.315Z'
                    connection_error: ''
              schema:
                "$ref": "#/components/schemas/bank_connection"
        '401':
          description: unauthorized
        '403':
          description: forbidden
        '404':
          description: user link not found. Occurs when the wealthAPI user is not
            linked to the mandator's user. i.e. no external_user_id has been provided.
            API consumers can fix this by creating the MandatorUserLink first.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                checksum:
                  type: string
                  description: Checksum representing the current state of the portfolio
                    data. Used to optimize the import process by avoiding re-importing
                    unchanged data.
        required: true
