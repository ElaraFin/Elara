      summary: create classification
      tags:
      - 'Admin Manager: ETF type classification'
      operationId: adminManagerCreateEtfTypeClassification
      security:
      - Bearer: []
      parameters: []
      responses:
        '201':
          description: Classification created
          content:
            application/vnd.api+json:
              example:
                data:
                  id: '33'
                  type: etf_type_classifications
                  attributes:
                    isin: IE00BKWQ0P031
                    is_etc: false
                    is_etf: true
                    is_curated: false
                    short_name: MOCK_SHORT_NAME
                  meta:
                    created_at: '2026-08-25T09:08:56Z'
                    updated_at: '2026-08-25T09:08:56Z'
              schema:
                "$ref": "#/components/schemas/etf_type_classification"
        '403':
          description: Forbidden
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              "$ref": "#/components/schemas/create_etf_type_classification"
        required: true
  "/api/v3/admin_manager/etf_type_classifications/{id}":
    patch:
      summary: update classification
      tags:
      - 'Admin Manager: ETF type classification'
      operationId: adminManagerUpdateEtfTypeClassification
      security:
      - Bearer: []
      parameters:
      - name: id
        in: path
        required: true
        description: 'The classification ID. Example: ''id=123'''
        schema:
          type: integer
      responses:
        '200':
          description: Classification updated
          content:
            application/vnd.api+json:
              example:
                data:
                  id: '34'
                  type: etf_type_classifications
                  attributes:
                    isin: MOCK_UPDATE_ISIN
                    is_etc: true
                    is_etf: false
                    is_curated: false
                    short_name: iShares Core S&P 500 UCITS ETF
                  meta:
                    created_at: '2026-08-25T09:08:56Z'
                    updated_at: '2026-08-25T09:08:56Z'
              schema:
                "$ref": "#/components/schemas/etf_type_classification"
        '404':
          description: Classification not found
        '403':
          description: Forbidden
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              "$ref": "#/components/schemas/update_etf_type_classification"
        required: true
    delete:
      summary: delete classification
      tags:
      - 'Admin Manager: ETF type classification'
      operationId: adminManagerDeleteEtfTypeClassification
      security:
      - Bearer: []
      parameters:
      - name: id
        in: path
        required: true
        description: 'The classification ID. Example: ''id=123'''
        schema:
          type: integer
      responses:
        '200':
          description: Classification deleted
        '404':
          description: Classification not found
        '403':
          description: Forbidden
  "/api/v3/admin_manager/logos":
    post:
      summary: upload logo
      tags:
      - 'Admin Manager: Logo upload'
      operationId: adminManagerUploadLogo
      security:
      - Bearer: []
      parameters: []
      responses:
        '200':
          description: Logo uploaded
        '400':
          description: Bad request
        '403':
          description: Forbidden
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                isin:
                  type: string
                  description: ISIN identifier
                file:
                  type: file
                  description: Logo file to upload
              required:
              - isin
              - file
